<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) ========== -->
    <title>NECODEV GZ</title>
    <meta name="description" content="NECODEV GZ - Platform pengembangan teknologi modern. Halaman ini dilindungi dari akses source code dan pengunduhan gambar.">
    
    <link rel="icon" type="image/png" sizes="512x512" href="#">
    <link rel="shortcut icon" href="#">
    
    <!-- IMPORT FONT ORBITRON -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) SELESAI ========== -->
    
    <style>
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) - CSS PROTEKSI & STYLE ========== */
        * {
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
        }
        
        /* ===== HALAMAN VIDEO ===== */
        .video-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }
        
        .video-page.hide {
            opacity: 0;
            visibility: hidden;
        }
        
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            display: block;
            width: auto;
            height: auto;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: none;
            outline: none;
            box-shadow: none;
            background: transparent;
        }
        
        video:focus {
            outline: none;
        }
        
        video::-webkit-media-controls {
            display: none !important;
        }
        
        /* ===== HALAMAN UTAMA ===== */
        .main-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: flex;
            flex-direction: column;
            padding: 16px;
            padding-bottom: 16px;
            overflow-y: auto;
        }
        
        .main-page.show {
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }
        
        /* HEADER RAMPING */
        .header {
            background-color: white;
            border-radius: 15px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 12px;
            min-height: 44px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .header-image {
            width: 28px;
            height: 28px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            background: transparent;
            border-radius: 6px;
        }
        
        .header-text {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: black;
            white-space: nowrap;
        }
        
        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .icon {
            width: 22px;
            height: 22px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon:hover {
            transform: scale(1.05);
        }
        
        .icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }
        
        /* ===== MENU IKON 4 BESAR (Website, Template, Domain, SEO) ===== */
        .icon-menu {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 16px;
            margin-top: 40px;
            width: 100%;
            flex-wrap: wrap;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
            flex: 1;
            min-width: 60px;
        }
        
        .menu-item:hover {
            transform: translateY(-3px);
        }
        
        .menu-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 12px;
            padding: 6px;
        }
        
        .menu-icon svg {
            width: 24px;
            height: 24px;
            display: block;
            fill: black;
            stroke: black;
        }
        
        .menu-label {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 600;
            color: white;
            text-align: center;
            letter-spacing: 0.5px;
        }
        
        /* ===== BANNER 16:5 ===== */
        .banner-container {
            width: 100%;
            margin-top: 24px;
            display: flex;
            justify-content: center;
        }
        
        .banner-image {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16 / 5;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            background: transparent;
            border-radius: 0px;
        }
        
        /* KONTEN TENGAH */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            text-align: center;
            opacity: 0.6;
            margin: 20px 0;
        }
        
        /* Proteksi drag */
        img, svg, canvas, picture, figure, video {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        
        .header-right .icon,
        .menu-item {
            pointer-events: auto;
        }
        
        :focus {
            outline: none;
        }
        
        @media print {
            body { display: none; }
        }
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) SELESAI ========== */
    </style>
</head>
<body>
    <!-- HALAMAN VIDEO -->
    <div class="video-page" id="videoPage">
        <div class="video-container">
            <video id="mainVideo" autoplay muted playsinline disablePictureInPicture controlslist="nodownload nofullscreen">
                <source src="Load.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    
    <!-- HALAMAN UTAMA -->
    <div class="main-page" id="mainPage">
        <!-- HEADER ATAS -->
        <div class="header">
            <div class="header-left">
                <img class="header-image" src="Header.png" alt="logo" id="headerImage">
                <span class="header-text">NECODEV GZ</span>
            </div>
            <div class="header-right">
                <div class="icon bell-icon" id="bellIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.93 6 11v5l-2 2v1h16v-1l-2-2z"/>
                    </svg>
                </div>
                <div class="icon cart-icon" id="cartIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- MENU 4 IKON: Website, Template, Domain, SEO -->
        <div class="icon-menu">
            <div class="menu-item" data-menu="website">
                <div class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                </div>
                <span class="menu-label">Website</span>
            </div>
            <div class="menu-item" data-menu="template">
                <div class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M4 6h16v2H4V6zm2-4h12v2H6V2zm16 4v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2zm-4 8c0-2.21-1.79-4-4-4s-4 1.79-4 4 1.79 4 4 4 4-1.79 4-4z"/>
                    </svg>
                </div>
                <span class="menu-label">Template</span>
            </div>
            <div class="menu-item" data-menu="domain">
                <div class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                        <circle cx="12" cy="12" r="2.5"/>
                    </svg>
                </div>
                <span class="menu-label">Domain</span>
            </div>
            <div class="menu-item" data-menu="seo">
                <div class="menu-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        <path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/>
                    </svg>
                </div>
                <span class="menu-label">SEO</span>
            </div>
        </div>
        
        <!-- BANNER 16:5 -->
        <div class="banner-container">
            <img class="banner-image" src="Tab.png" alt="banner" id="bannerImage">
        </div>
    
    <script>
        (function() {
            // ========== PROTEKSI ==========
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 85) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) { e.preventDefault(); return false; }
                if (e.keyCode === 123) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                    e.preventDefault(); return false;
                }
            });
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
            window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
            document.onselectstart = function() { return false; };
            console.log = console.warn = console.error = console.info = function() {};
            document.oncopy = document.oncut = document.onpaste = function(e) { e.preventDefault(); return false; };
            
            // ========== ELEMEN ==========
            const videoPage = document.getElementById('videoPage');
            const mainPage = document.getElementById('mainPage');
            const video = document.getElementById('mainVideo');
            const mainContent = document.getElementById('mainContent');
            const menuItems = document.querySelectorAll('.menu-item');
            
            // ========== SET VIDEO ==========
            video.loop = false;
            video.muted = true;
            video.playsInline = true;
            video.controls = false;
            
            // PAKAI LINK VIDEO ONLINE
            video.src = "Load.mp4";
            
            // ========== EVENT VIDEO SELESAI ==========
            video.addEventListener('ended', function() {
                console.log('Video selesai, pindah halaman');
                videoPage.classList.add('hide');
                mainPage.classList.add('show');
            });
            
            // Fallback timeout 8 detik
            setTimeout(function() {
                if (videoPage && !videoPage.classList.contains('hide')) {
                    console.log('Fallback timeout: paksa pindah halaman');
                    videoPage.classList.add('hide');
                    mainPage.classList.add('show');
                }
            }, 8000);
            
            // Autoplay
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log('Autoplay gagal: ' + error);
                    setTimeout(function() {
                        if (videoPage && !videoPage.classList.contains('hide')) {
                            videoPage.classList.add('hide');
                            mainPage.classList.add('show');
                        }
                    }, 3000);
                });
            }
            
            video.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            video.disablePictureInPicture = true;
            
            // ========== MENU IKON ==========
            menuItems.forEach(item => {
                item.addEventListener('click', function() {
                    const menuName = this.getAttribute('data-menu');
                    let displayText = '';
                    switch(menuName) {
                        case 'website': displayText = '💻 WEBSITE - Jasa pembuatan website profesional'; break;
                        case 'template': displayText = '🎨 TEMPLATE - Desain template modern & responsif'; break;
                        case 'domain': displayText = '🌐 DOMAIN - Cari & daftar domain murah'; break;
                        case 'seo': displayText = '📈 SEO - Optimasi mesin pencari Google'; break;
                        default: displayText = '🚀 NECODEV GZ';
                    }
                    mainContent.innerHTML = `<span style="font-size: 18px; opacity: 0.6;">✨ ${displayText} ✨</span>`;
                });
            });
            
            // ========== IKON HEADER ==========
            document.getElementById('bellIcon').addEventListener('click', function() { alert('🔔 Notifikasi'); });
            document.getElementById('cartIcon').addEventListener('click', function() { alert('🛒 Keranjang'); });
            
            // ========== FOTO HEADER 1:1 ==========
            const headerImage = document.getElementById('headerImage');
            headerImage.src = "Header.png";
            
            // ========== BANNER 16:5 ==========
            const bannerImage = document.getElementById('bannerImage');
            bannerImage.src = "Tab.png";
        })();
    </script>
</body>
</html>
