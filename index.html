<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) ========== -->
    <title>NECODEV GZ</title>
    <meta name="description" content="NECODEV GZ - Platform pengembangan teknologi modern. Halaman ini dilindungi dari akses source code dan pengunduhan gambar.">
    
    <link rel="icon" type="image/png" sizes="512x512" href="#">
    <link rel="shortcut icon" href="#">
    
    <!-- IMPORT FONT MINECRAFT -->
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) SELESAI ========== -->
    
    <style>
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) - CSS PROTEKSI & STYLE ========== */
        * {
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Minecraft', 'Courier New', monospace;
        }
        
        /* ===== HALAMAN VIDEO ===== */
        .video-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }
        
        .video-page.hide {
            opacity: 0;
            visibility: hidden;
        }
        
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            display: block;
            width: auto;
            height: auto;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: none;
            outline: none;
            box-shadow: none;
            background: transparent;
        }
        
        video:focus {
            outline: none;
        }
        
        video::-webkit-media-controls {
            display: none !important;
        }
        
        /* ===== HALAMAN UTAMA ===== */
        .main-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto;
            padding: 20px;
        }
        
        .main-page.show {
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }
        
        /* HEADER RAMPING */
        .header {
            background-color: white;
            border-radius: 15px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            gap: 16px;
            min-height: 48px;
        }
        
        /* Bagian kiri: foto 1:1 + teks NECODEV GZ */
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .header-image {
            width: 32px;
            height: 32px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            background: transparent;
            border-radius: 8px;
        }
        
        .header-text {
            font-family: 'Minecraft', 'Courier New', monospace;
            font-size: 16px;
            font-weight: normal;
            color: black;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        /* Bagian kanan: ikon */
        .header-right {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon:hover {
            transform: scale(1.05);
        }
        
        .icon svg {
            width: 22px;
            height: 22px;
            display: block;
        }
        
        .content-placeholder {
            margin-top: 40px;
            text-align: center;
            color: white;
            opacity: 0.3;
            font-size: 12px;
            font-family: monospace;
        }
        
        /* Proteksi drag */
        img, svg, canvas, picture, figure, video {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        
        .header-right .icon {
            pointer-events: auto;
        }
        
        :focus {
            outline: none;
        }
        
        @media print {
            body { display: none; }
        }
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) SELESAI ========== */
    </style>
</head>
<body>
    <!-- HALAMAN VIDEO -->
    <div class="video-page" id="videoPage">
        <div class="video-container">
            <video id="mainVideo" autoplay muted playsinline disablePictureInPicture controlslist="nodownload nofullscreen">
                <source src="Load.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    
    <!-- HALAMAN UTAMA -->
    <div class="main-page" id="mainPage">
        <div class="header">
            <div class="header-left">
                <img class="header-image" src="Head.png" alt="logo" id="headerImage">
                <span class="header-text">NECODEV GZ</span>
            </div>
            <div class="header-right">
                <div class="icon bell-icon" id="bellIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.93 6 11v5l-2 2v1h16v-1l-2-2z"/>
                    </svg>
                </div>
                <div class="icon cart-icon" id="cartIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="content-placeholder">
            <!-- Konten bebas -->
        </div>
    </div>
    
    <script>
        (function() {
            // ========== PROTEKSI ==========
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 85) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) { e.preventDefault(); return false; }
                if (e.keyCode === 123) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                    e.preventDefault(); return false;
                }
            });
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
            window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
            document.onselectstart = function() { return false; };
            console.log = console.warn = console.error = console.info = function() {};
            document.oncopy = document.oncut = document.onpaste = function(e) { e.preventDefault(); return false; };
            
            // ========== ELEMEN ==========
            const videoPage = document.getElementById('videoPage');
            const mainPage = document.getElementById('mainPage');
            const video = document.getElementById('mainVideo');
            
            // ========== SET VIDEO ==========
            video.loop = false;
            video.muted = true;
            video.playsInline = true;
            video.controls = false;
            
            // PAKAI LINK VIDEO ONLINE
            video.src = "Load.mp4";
            
            // ========== EVENT VIDEO SELESAI ==========
            video.addEventListener('ended', function() {
                console.log('Video selesai, pindah halaman');
                videoPage.classList.add('hide');
                mainPage.classList.add('show');
            });
            
            // Fallback timeout 8 detik
            setTimeout(function() {
                if (videoPage && !videoPage.classList.contains('hide')) {
                    console.log('Fallback timeout: paksa pindah halaman');
                    videoPage.classList.add('hide');
                    mainPage.classList.add('show');
                }
            }, 8000);
            
            // Autoplay
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function(error) {
                    console.log('Autoplay gagal: ' + error);
                    setTimeout(function() {
                        if (videoPage && !videoPage.classList.contains('hide')) {
                            videoPage.classList.add('hide');
                            mainPage.classList.add('show');
                        }
                    }, 3000);
                });
            }
            
            video.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            video.disablePictureInPicture = true;
            
            // ========== IKON ==========
            document.getElementById('bellIcon').addEventListener('click', function() { alert('🔔 Notifikasi'); });
            document.getElementById('cartIcon').addEventListener('click', function() { alert('🛒 Keranjang'); });
            
            // ========== FOTO HEADER 1:1 ==========
            const headerImage = document.getElementById('headerImage');
            // Ganti dengan link foto 1:1 Anda
            headerImage.src = "Head.png";
        })();
    </script>
</body>
</html>
