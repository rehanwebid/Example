<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) ========== -->
    <title>NECODEV GZ</title>
    <meta name="description" content="NECODEV GZ - Platform pengembangan teknologi modern. Halaman ini dilindungi dari akses source code dan pengunduhan gambar.">
    
    <!-- Favicon 1:1 (siap diisi sendiri) -->
    <link rel="icon" type="image/png" sizes="512x512" href="#">
    <link rel="shortcut icon" href="#">
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) SELESAI ========== -->
    
    <!-- CSS Proteksi & Styling -->
    <style>
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) - CSS PROTEKSI ========== */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-user-drag: none;
        }
        
        /* Video container - MURNI tanpa border, shadow, apapun */
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            height: auto;
        }
        
        video {
            /* TANPA BORDER, TANPA OUTLINE, TANPA BAYANGAN */
            display: block;
            width: auto;
            height: auto;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: none;
            outline: none;
            box-shadow: none;
            background: transparent;
        }
        
        /* Hilangkan semua dekorasi bawaan video */
        video:focus {
            outline: none;
        }
        
        /* Sembunyikan kontrol default video (biar murni) */
        video::-webkit-media-controls {
            display: none !important;
        }
        
        /* Mencegah semua gambar bisa di-drag/save */
        img, svg, canvas, picture, figure, video {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        
        /* Mencegah highlight biru saat klik */
        :focus {
            outline: none;
        }
        
        /* Mencegah cetak (print) halaman */
        @media print {
            body {
                display: none;
            }
        }
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) SELESAI ========== */
    </style>
</head>
<body>
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (3) - VIDEO UTAMA ========== -->
    <div class="video-container">
        <video id="mainVideo" autoplay loop="false" muted playsinline disablePictureInPicture>
            <source src="Pict/Load.mp4" type="video/mp4">
        </video>
    </div>
    
    <script>
        // ========== PENANDA KHUSUS: BAGIAN PENTING (4) - JAVASCRIPT PROTEKSI & VIDEO ==========
        
        (function() {
            // ========== PROTEKSI TOTAL ==========
            // 1. Mencegah CTRL+U (View Source)
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 85) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) {
                    e.preventDefault();
                    return false;
                }
                if (e.keyCode === 123) {
                    e.preventDefault();
                    return false;
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // 2. Mencegah klik kanan
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // 3. Mencegah drag
            window.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // 4. Mencegah seleksi teks
            document.onselectstart = function() { return false; };
            
            // 5. Nonaktifkan console
            console.log = function() {};
            console.warn = function() {};
            console.error = function() {};
            console.info = function() {};
            
            // 6. Mencegah PrintScreen
            document.addEventListener('keyup', function(e) {
                if (e.key === 'PrintScreen') {
                    navigator.clipboard.writeText('');
                    e.preventDefault();
                    return false;
                }
            });
            
            // 7. Mencegah copy/cut/paste
            document.oncopy = function(e) { e.preventDefault(); return false; };
            document.oncut = function(e) { e.preventDefault(); return false; };
            document.onpaste = function(e) { e.preventDefault(); return false; };
            
            // ========== KONTROL VIDEO ==========
            const video = document.getElementById('mainVideo');
            
            // Set video untuk autoplay dan play sekali (tidak loop)
            video.loop = false;     // Hanya putar 1x
            video.muted = true;     // Wajib muted untuk autoplay di browser modern
            video.playsInline = true; // Biar tidak fullscreen otomatis di mobile
            
            // Coba autoplay
            let playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Autoplay berhasil
                    console.log('Video autoplay berjalan');
                }).catch(() => {
                    // Fallback: jika autoplay gagal, tetap diam (tidak muncul kontrol)
                    console.log('Autoplay perlu interaksi - tapi tetap murni hitam');
                });
            }
            
            // Pastikan video tidak bisa di-save via keyboard (proteksi tambahan)
            video.addEventListener('contextmenu', (e) => e.preventDefault());
            video.addEventListener('dragstart', (e) => e.preventDefault());
            
            // Mencegah video masuk picture-in-picture
            video.disablePictureInPicture = true;
            
            // Mencegah download video (hilangkan kontrol)
            video.controls = false;
            video.controlsList = "nodownload nofullscreen noremoteplayback";
            
            // ========== PENGINGAT UNTUK USER (TIDAK TAMPIL) ==========
            // Catatan: Ganti src video di bawah ini dengan file video 1:1 Anda
            // Contoh: video.src = "video_1x1.mp4";
            // Saat ini src masih kosong (""), Anda bisa menggantinya.
            
        })();
        
        // ========== TEMPAT SETELAH PROTEKSI ==========
        // INSTRUKSI: Ganti video.src dengan URL video 1:1 Anda
        // Contoh: document.getElementById('mainVideo').src = "video_anda.mp4";
        
        // ========== PENANDA KHUSUS: BAGIAN PENTING (4) SELESAI ==========
    </script>
</body>
</html>
