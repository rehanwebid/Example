<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DataNSB - Catatan Tabungan</title>
    
    <!-- ============================================ -->
    <!-- FAVICON & WEB APP MANIFEST                   -->
    <!-- ============================================ -->
    <link rel="icon" type="image/png" href="ikon-192.png">
    <link rel="apple-touch-icon" href="ikon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#376E9E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DataNSB">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Ikon: Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ============ RESET & BASE ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primer: #376E9E;
            --primer-tua: #2C5A82;
            --primer-muda: #DCE9F3;
            --primer-bg: #EDF3F8;
            --putih: #FFFFFF;
            --abu-bg: #F1F5F9;
            --abu-teks: #64748B;
            --abu-silver: #94A3B8;
            --abu-card: #E2E8F0;
            --teks-gelap: #1E293B;
            --teks-hitam: #151515;
            --merah-soft: #EF4444;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--abu-bg);
            color: var(--teks-gelap);
            min-height: 100vh;
            padding-bottom: 100px;
            font-size: 16px;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent;
            /* Safe area untuk iPhone notch */
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
        }

        /* ============ NOTIFIKASI ============ */
        .notif {
            position: fixed;
            top: -100px;
            left: 16px;
            right: 16px;
            z-index: 999;
            background: #FEF2F2;
            border: 2px solid #FECACA;
            color: #991B1B;
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: top 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
            max-width: 500px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
        }

        .notif.show {
            top: calc(16px + env(safe-area-inset-top));
        }

        .notif i {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            stroke: #991B1B;
        }

        /* ============ HEADER ============ */
        .header {
            background: var(--primer);
            color: var(--putih);
            padding: 18px 20px;
            padding-top: calc(18px + env(safe-area-inset-top));
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-top i {
            width: 28px;
            height: 28px;
            stroke-width: 2.5;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 2px;
            padding-left: 38px;
        }

        /* ============ KONTEN ============ */
        .content {
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ============ SEARCH BAR ============ */
        .search-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: var(--abu-silver);
            pointer-events: none;
            z-index: 1;
        }

        #searchInput {
            width: 100%;
            padding: 15px 15px 15px 44px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: var(--putih);
            outline: none;
            color: var(--teks-gelap);
        }

        #searchInput:focus {
            border-color: var(--primer);
        }

        #searchInput::placeholder {
            color: #94A3B8;
        }

        /* ============ KOSONG ============ */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--abu-teks);
        }

        .empty-state i {
            width: 64px;
            height: 64px;
            stroke: #CBD5E1;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: var(--teks-gelap);
        }

        .empty-state p {
            font-size: 14px;
        }

        /* ============ CARD NASABAH ============ */
        .nasabah-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background: var(--putih);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: box-shadow 0.2s;
            border-left: 5px solid var(--primer);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--teks-gelap);
        }

        .card:active {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .card-kiri {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .card-ikon {
            background: var(--primer-muda);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-ikon i {
            width: 24px;
            height: 24px;
            stroke: var(--primer);
        }

        .card-info {
            min-width: 0;
        }

        .card-nama {
            font-weight: 600;
            font-size: 17px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-telp {
            font-size: 12px;
            color: var(--abu-teks);
            margin-top: 1px;
        }

        .card-kanan {
            text-align: right;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .card-label {
            font-size: 11px;
            color: var(--abu-teks);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-saldo {
            font-weight: 700;
            font-size: 18px;
            color: var(--primer);
        }

        /* ============ TOMBOL TAMBAH NASABAH ============ */
        .btn-tambah-wrapper {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            z-index: 100;
            max-width: 500px;
            margin: 0 auto;
            bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .btn-tambah {
            width: 100%;
            padding: 16px;
            background: var(--primer);
            color: var(--putih);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(55, 110, 158, 0.4);
        }

        .btn-tambah:active {
            background: var(--primer-tua);
        }

        .btn-tambah i {
            width: 22px;
            height: 22px;
        }

        /* ============ DETAIL PAGE ============ */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primer);
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .back-btn i {
            width: 20px;
            height: 20px;
        }

        .detail-header {
            background: var(--putih);
            border-radius: var(--radius);
            padding: 24px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            border-top: 5px solid var(--primer);
        }

        .detail-ikon {
            background: var(--primer-muda);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .detail-ikon i {
            width: 40px;
            height: 40px;
            stroke: var(--primer);
        }

        .detail-nama {
            font-size: 22px;
            font-weight: 700;
        }

        .detail-telp {
            font-size: 14px;
            color: var(--abu-teks);
            margin-top: 2px;
        }

        .detail-saldo {
            font-size: 32px;
            font-weight: 800;
            color: var(--primer);
            margin-top: 8px;
        }

        .detail-label {
            font-size: 13px;
            color: var(--abu-teks);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ============ TOMBOL AKSI ============ */
        .aksi-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-aksi {
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-aksi:active {
            opacity: 0.85;
        }

        .btn-tarik {
            background: #E2E8F0;
            color: #475569;
        }

        .btn-setor {
            background: var(--primer);
            color: var(--putih);
        }

        .btn-tarik i, .btn-setor i {
            width: 22px;
            height: 22px;
        }

        /* ============ RIWAYAT ============ */
        .riwayat-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--teks-gelap);
        }

        .riwayat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .riwayat-item {
            background: var(--putih);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .riwayat-kiri {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .riwayat-ikon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .riwayat-ikon.setor {
            background: var(--primer-muda);
        }

        .riwayat-ikon.setor i {
            stroke: var(--primer);
        }

        .riwayat-ikon.tarik {
            background: #E2E8F0;
        }

        .riwayat-ikon.tarik i {
            stroke: #64748B;
        }

        .riwayat-ikon i {
            width: 20px;
            height: 20px;
        }

        .riwayat-tanggal {
            font-size: 14px;
            font-weight: 500;
        }

        .riwayat-jenis {
            font-size: 12px;
            color: var(--abu-teks);
        }

        .riwayat-nominal {
            font-weight: 700;
            font-size: 16px;
        }

        .riwayat-nominal.setor {
            color: var(--primer);
        }

        .riwayat-nominal.tarik {
            color: #64748B;
        }

        .riwayat-kosong {
            text-align: center;
            padding: 30px;
            color: var(--abu-teks);
            font-size: 14px;
        }

        /* ============ MODAL ============ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--putih);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px 20px 30px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--teks-gelap);
        }

        .form-group label .wajib {
            color: #DC2626;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            text-transform: uppercase;
        }

        .form-group input:focus {
            border-color: var(--primer);
        }

        .form-group input[type="number"],
        .form-group input[type="tel"] {
            text-transform: none;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primer);
            color: var(--putih);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:active {
            background: var(--primer-tua);
        }

        .btn-submit.abu {
            background: #E2E8F0;
            color: #475569;
        }

        .btn-batal {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--abu-teks);
            border: none;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            font-weight: 500;
        }

        .btn-hapus {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--teks-hitam);
            border: none;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 6px;
            font-weight: 500;
        }

        .modal p.desc {
            text-align: center;
            color: var(--abu-teks);
            margin-bottom: 16px;
            font-size: 14px;
        }

        /* ============ REGISTER SERVICE WORKER ============ */
        /* Ini di handle oleh JavaScript di bawah */
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- NOTIFIKASI SLIDE                             -->
    <!-- ============================================ -->
    <div class="notif" id="notif">
        <i data-lucide="alert-circle"></i>
        <span id="notifText"></span>
    </div>

    <!-- ============================================ -->
    <!-- HALAMAN UTAMA (DAFTAR NASABAH)               -->
    <!-- ============================================ -->
    <div id="halamanUtama">
        <div class="header">
            <div class="header-top">
                <i data-lucide="landmark"></i>
                <h1>DataNSB</h1>
            </div>
            <p>Catatan Tabungan Digital</p>
        </div>

        <div class="content">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔎︎ Cari nama nasabah..." oninput="renderNasabah()" autocomplete="off">
            </div>

            <div id="nasabahContainer"></div>
        </div>

        <div class="btn-tambah-wrapper">
            <button class="btn-tambah" onclick="bukaModalTambahNasabah()">
                <i data-lucide="user-plus"></i> Tambah Nasabah
            </button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- HALAMAN DETAIL NASABAH                       -->
    <!-- ============================================ -->
    <div id="halamanDetail" style="display:none;">
        <div class="header">
            <div class="header-top">
                <i data-lucide="landmark"></i>
                <h1>DataNSB</h1>
            </div>
        </div>

        <div class="content" id="detailContent"></div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL TAMBAH NASABAH                         -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="modalTambahNasabah">
        <div class="modal">
            <h2>Tambah Nasabah Baru</h2>
            <div class="form-group">
                <label>Nama Lengkap <span class="wajib">*</span></label>
                <input type="text" id="inputNama" placeholder="Masukkan nama nasabah" autocomplete="off">
            </div>
            <div class="form-group">
                <label>No. Telepon</label>
                <input type="tel" id="inputTelp" placeholder="Nomor HP (opsional)" autocomplete="off">
            </div>
            <button class="btn-submit" onclick="tambahNasabah()">Simpan</button>
            <button class="btn-batal" onclick="tutupModal('modalTambahNasabah')">Batal</button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL TRANSAKSI                              -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="modalTransaksi">
        <div class="modal">
            <h2 id="judulTransaksi">Catat Transaksi</h2>
            <input type="hidden" id="transaksiNasabahId">
            <input type="hidden" id="transaksiJenis">
            <div class="form-group">
                <label>Jumlah (Rp) <span class="wajib">*</span></label>
                <input type="number" id="inputNominal" placeholder="Masukkan jumlah uang" min="1">
            </div>
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="inputKeterangan" placeholder="Keterangan tambahan (opsional)">
            </div>
            <button class="btn-submit" onclick="catatTransaksi()">Simpan Transaksi</button>
            <button class="btn-batal" onclick="tutupModal('modalTransaksi')">Batal</button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL HAPUS NASABAH                          -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="modalHapus">
        <div class="modal">
            <h2 id="judulHapus">Hapus Nasabah?</h2>
            <p class="desc">
                Semua data transaksi juga akan dihapus.<br>Tindakan ini tidak bisa dibatalkan.
            </p>
            <input type="hidden" id="hapusNasabahId">
            <button class="btn-submit abu" onclick="hapusNasabah()">Ya, Hapus</button>
            <button class="btn-batal" onclick="tutupModal('modalHapus')">Batal</button>
        </div>
    </div>

    <script>
        // ============================================
        // REGISTER SERVICE WORKER (untuk PWA/fullscreen)
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {
                    // Service worker optional, silent fail
                });
            });
        }

        // ============================================
        // DATA & LOCALSTORAGE
        // ============================================
        const STORAGE_KEY = 'datansb_data_v3';

        function ambilData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : { nasabah: [], transaksi: [], idCounter: 0 };
        }

        function simpanData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // ============================================
        // NOTIFIKASI
        // ============================================
        let notifTimer = null;

        function tampilkanNotif(pesan) {
            const notif = document.getElementById('notif');
            const notifText = document.getElementById('notifText');
            
            if (notifTimer) clearTimeout(notifTimer);
            
            notifText.textContent = pesan;
            notif.classList.add('show');
            
            notifTimer = setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
            
            lucide.createIcons();
        }

        // ============================================
        // FORMAT RUPIAH
        // ============================================
        function formatRupiah(angka) {
            return 'Rp ' + angka.toLocaleString('id-ID');
        }

        // ============================================
        // HITUNG SALDO
        // ============================================
        function hitungSaldo(nasabahId) {
            const data = ambilData();
            const transaksiList = data.transaksi.filter(t => t.nasabahId === nasabahId);
            let saldo = 0;
            transaksiList.forEach(t => {
                if (t.jenis === 'setor') saldo += t.nominal;
                else saldo -= t.nominal;
            });
            return saldo;
        }

        // ============================================
        // RENDER HALAMAN UTAMA
        // ============================================
        function renderNasabah() {
            const data = ambilData();
            const keyword = document.getElementById('searchInput')?.value.toUpperCase() || '';
            
            let filtered = data.nasabah;
            if (keyword) {
                filtered = data.nasabah.filter(n => n.nama.toUpperCase().startsWith(keyword));
            }
            
            filtered.sort((a, b) => a.nama.localeCompare(b.nama));
            
            const container = document.getElementById('nasabahContainer');
            
            if (filtered.length === 0) {
                if (data.nasabah.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i data-lucide="users"></i>
                            <h3>Belum ada nasabah</h3>
                            <p>Tekan tombol "Tambah Nasabah" untuk memulai</p>
                        </div>`;
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i data-lucide="search-x"></i>
                            <h3>Tidak ditemukan</h3>
                            <p>Nasabah dengan kata kunci "${keyword}" tidak ada</p>
                        </div>`;
                }
            } else {
                container.innerHTML = `
                    <div class="nasabah-list">
                        ${filtered.map(n => {
                            const saldo = hitungSaldo(n.id);
                            return `
                                <div class="card" onclick="bukaDetail(${n.id})">
                                    <div class="card-kiri">
                                        <div class="card-ikon">
                                            <i data-lucide="user"></i>
                                        </div>
                                        <div class="card-info">
                                            <div class="card-nama">${n.nama}</div>
                                            ${n.telepon ? `<div class="card-telp">📞 ${n.telepon}</div>` : ''}
                                        </div>
                                    </div>
                                    <div class="card-kanan">
                                        <div class="card-label">Saldo</div>
                                        <div class="card-saldo">${formatRupiah(saldo)}</div>
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>`;
            }
            
            lucide.createIcons();
        }

        // ============================================
        // NAVIGASI
        // ============================================
        function bukaDetail(id) {
            const data = ambilData();
            const nasabah = data.nasabah.find(n => n.id === id);
            if (!nasabah) return;
            
            document.getElementById('halamanUtama').style.display = 'none';
            document.getElementById('halamanDetail').style.display = 'block';
            renderDetail(id);
            window.scrollTo(0, 0);
        }

        function balikKeUtama() {
            document.getElementById('halamanDetail').style.display = 'none';
            document.getElementById('halamanUtama').style.display = 'block';
            document.getElementById('searchInput').value = '';
            renderNasabah();
            window.scrollTo(0, 0);
        }

        // ============================================
        // RENDER HALAMAN DETAIL
        // ============================================
        function renderDetail(nasabahId) {
            const data = ambilData();
            const nasabah = data.nasabah.find(n => n.id === nasabahId);
            if (!nasabah) return;
            
            const saldo = hitungSaldo(nasabahId);
            const transaksiList = data.transaksi
                .filter(t => t.nasabahId === nasabahId)
                .sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
            
            document.getElementById('detailContent').innerHTML = `
                <a class="back-btn" href="javascript:void(0)" onclick="balikKeUtama()">
                    <i data-lucide="arrow-left"></i> Kembali
                </a>

                <div class="detail-header">
                    <div class="detail-ikon">
                        <i data-lucide="user"></i>
                    </div>
                    <div class="detail-nama">${nasabah.nama}</div>
                    ${nasabah.telepon ? `<div class="detail-telp">📞 ${nasabah.telepon}</div>` : ''}
                    <div class="detail-label">Saldo Tabungan</div>
                    <div class="detail-saldo">${formatRupiah(saldo)}</div>
                </div>

                <div class="aksi-wrapper">
                    <button class="btn-aksi btn-tarik" onclick="bukaModalTransaksi(${nasabahId}, 'tarik', '${nasabah.nama.replace(/'/g, "\\'")}')">
                        <i data-lucide="arrow-down-circle"></i> Tarik
                    </button>
                    <button class="btn-aksi btn-setor" onclick="bukaModalTransaksi(${nasabahId}, 'setor', '${nasabah.nama.replace(/'/g, "\\'")}')">
                        <i data-lucide="arrow-up-circle"></i> Setor
                    </button>
                </div>

                <div class="riwayat-title">Riwayat Transaksi</div>
                <div class="riwayat-list">
                    ${transaksiList.length === 0 ? 
                        `<div class="riwayat-kosong">Belum ada transaksi</div>` :
                        transaksiList.map(t => `
                            <div class="riwayat-item">
                                <div class="riwayat-kiri">
                                    <div class="riwayat-ikon ${t.jenis}">
                                        ${t.jenis === 'setor' ? 
                                            '<i data-lucide="arrow-up-circle"></i>' : 
                                            '<i data-lucide="arrow-down-circle"></i>'}
                                    </div>
                                    <div>
                                        <div class="riwayat-tanggal">${formatTanggal(t.tanggal)}</div>
                                        <div class="riwayat-jenis">${t.jenis === 'setor' ? 'Setor' : 'Tarik'} ${t.keterangan ? '· ' + t.keterangan : ''}</div>
                                    </div>
                                </div>
                                <div class="riwayat-nominal ${t.jenis}">
                                    ${t.jenis === 'setor' ? '+' : '-'} ${formatRupiah(t.nominal)}
                                </div>
                            </div>
                        `).join('')
                    }
                </div>

                <div style="margin-top: 20px; text-align: center;">
                    <button class="btn-hapus" onclick="bukaModalHapus(${nasabahId}, '${nasabah.nama.replace(/'/g, "\\'")}')">
                        Hapus Nasabah Ini
                    </button>
                </div>
            `;
            
            lucide.createIcons();
        }

        function formatTanggal(tanggalStr) {
            const tanggal = new Date(tanggalStr);
            const hari = tanggal.getDate();
            const bulan = [
                'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ][tanggal.getMonth()];
            const tahun = tanggal.getFullYear();
            return `${hari} ${bulan} ${tahun}`;
        }

        // ============================================
        // MODAL
        // ============================================
        function bukaModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function tutupModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function bukaModalTambahNasabah() {
            document.getElementById('inputNama').value = '';
            document.getElementById('inputTelp').value = '';
            bukaModal('modalTambahNasabah');
            setTimeout(() => document.getElementById('inputNama').focus(), 200);
        }

        function bukaModalTransaksi(nasabahId, jenis, nama) {
            document.getElementById('transaksiNasabahId').value = nasabahId;
            document.getElementById('transaksiJenis').value = jenis;
            document.getElementById('inputNominal').value = '';
            document.getElementById('inputKeterangan').value = '';
            document.getElementById('judulTransaksi').textContent = 
                `${jenis === 'setor' ? 'Setor' : 'Tarik'} - ${nama}`;
            bukaModal('modalTransaksi');
            setTimeout(() => document.getElementById('inputNominal').focus(), 200);
        }

        function bukaModalHapus(id, nama) {
            document.getElementById('hapusNasabahId').value = id;
            document.getElementById('judulHapus').textContent = `Hapus ${nama}?`;
            bukaModal('modalHapus');
        }

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        // ============================================
        // CRUD OPERATIONS
        // ============================================
        function tambahNasabah() {
            const namaInput = document.getElementById('inputNama').value.trim();
            const nama = namaInput.toUpperCase();
            
            if (!nama) {
                tampilkanNotif('Nama nasabah wajib diisi!');
                return;
            }
            
            const data = ambilData();
            const duplikat = data.nasabah.find(n => n.nama.toUpperCase() === nama);
            if (duplikat) {
                document.getElementById('inputNama').value = '';
                document.getElementById('inputTelp').value = '';
                tampilkanNotif(`Nama "${nama}" sudah ada, silakan gunakan nama lain.`);
                document.getElementById('inputNama').focus();
                return;
            }
            
            data.idCounter++;
            data.nasabah.push({
                id: data.idCounter,
                nama: nama,
                telepon: document.getElementById('inputTelp').value.trim(),
                tanggalDibuat: new Date().toISOString()
            });
            simpanData(data);
            tutupModal('modalTambahNasabah');
            renderNasabah();
        }

        function catatTransaksi() {
            const nasabahId = parseInt(document.getElementById('transaksiNasabahId').value);
            const jenis = document.getElementById('transaksiJenis').value;
            const nominal = parseInt(document.getElementById('inputNominal').value);
            
            if (!nominal || nominal <= 0) {
                tampilkanNotif('Jumlah uang wajib diisi!');
                return;
            }
            
            if (jenis === 'tarik') {
                const saldo = hitungSaldo(nasabahId);
                if (nominal > saldo) {
                    tampilkanNotif('Saldo tidak cukup! Saldo saat ini: ' + formatRupiah(saldo));
                    return;
                }
            }
            
            const data = ambilData();
            data.transaksi.push({
                id: Date.now(),
                nasabahId: nasabahId,
                jenis: jenis,
                nominal: nominal,
                keterangan: document.getElementById('inputKeterangan').value.trim(),
                tanggal: new Date().toISOString()
            });
            simpanData(data);
            tutupModal('modalTransaksi');
            renderDetail(nasabahId);
        }

        function hapusNasabah() {
            const id = parseInt(document.getElementById('hapusNasabahId').value);
            const data = ambilData();
            data.nasabah = data.nasabah.filter(n => n.id !== id);
            data.transaksi = data.transaksi.filter(t => t.nasabahId !== id);
            simpanData(data);
            tutupModal('modalHapus');
            balikKeUtama();
        }

        // ============================================
        // INIT
        // ============================================
        renderNasabah();
    </script>
</body>
</html>
