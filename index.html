<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) ========== -->
    <title>NECODEV GZ</title>
    <meta name="description" content="NECODEV GZ - Platform pengembangan teknologi modern. Halaman ini dilindungi dari akses source code dan pengunduhan gambar.">
    
    <link rel="icon" type="image/png" sizes="512x512" href="#">
    <link rel="shortcut icon" href="#">
    
    <!-- IMPORT FONT ORBITRON -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
        }
        
        /* ===== HALAMAN VIDEO ===== */
        .video-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }
        
        .video-page.hide {
            opacity: 0;
            visibility: hidden;
        }
        
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            display: block;
            width: auto;
            height: auto;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: none;
            outline: none;
            box-shadow: none;
            background: transparent;
        }
        
        video:focus {
            outline: none;
        }
        
        video::-webkit-media-controls {
            display: none !important;
        }
        
        /* ===== HALAMAN UTAMA ===== */
        .main-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: flex;
            flex-direction: column;
            padding: 16px;
            padding-bottom: 16px;
            overflow-y: auto;
        }
        
        .main-page.show {
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }
        
        /* HEADER */
        .header {
            background-color: white;
            border-radius: 15px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 12px;
            min-height: 44px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        
        .header-image {
            width: 28px;
            height: 28px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            background: transparent;
            border-radius: 6px;
        }
        
        .header-text {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: black;
            white-space: nowrap;
        }
        
        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .icon {
            width: 22px;
            height: 22px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon:hover {
            transform: scale(1.05);
        }
        
        .icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }
        
        /* ===== MENU IKON ===== */
        .icon-menu {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 16px;
            margin-top: 40px;
            width: 100%;
            flex-wrap: wrap;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
            flex: 1;
            min-width: 60px;
        }
        
        .menu-item:hover {
            transform: translateY(-3px);
        }
        
        .menu-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-icon svg {
            width: 28px;
            height: 28px;
            display: block;
            fill: white;
        }
        
        .menu-label {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 600;
            color: white;
            text-align: center;
            letter-spacing: 0.5px;
        }
        
        /* BANNER - margin bottom diperkecil */
        .banner-container {
            width: 100%;
            margin-top: 24px;
            margin-bottom: 0px;
            display: flex;
            justify-content: center;
        }
        
        .banner-image {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 16 / 5;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            background: transparent;
            border-radius: 0px;
        }
        
        /* ===== SLIDING TEXT - TANPA PERSEGI PANJANG, JARAK DIPERKECIL ===== */
        .sliding-container {
            width: 100%;
            margin-top: 8px;  /* DARI 20px MENJADI 8px (LEBIH DEKAT KE BANNER) */
            margin-bottom: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 36px;
        }
        
        .sliding-text {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 500;
            color: white;
            text-align: center;
            letter-spacing: 0.5px;
            animation: zoomIn 0.5s ease forwards;
        }
        
        .sliding-text.zoom-out {
            animation: zoomOut 0.5s ease forwards;
        }
        
        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes zoomOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }
        
        /* STATS CARD - margin top diperkecil */
        .stats-card {
            background-color: black;
            border: 1px solid white;
            border-radius: 12px;
            padding: 16px 12px;
            margin-top: 8px;  /* DARI 20px MENJADI 8px (LEBIH DEKAT KE TEKS) */
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 8px;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            text-align: center;
        }
        
        .stat-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stat-icon svg {
            width: 28px;
            height: 28px;
            display: block;
            fill: none;
            stroke: white;
            stroke-width: 1.5;
        }
        
        .stat-label {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 500;
            color: #9ca3af;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            color: white;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
            box-shadow: 0 0 4px #22c55e;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* KONTEN TENGAH - margin top diperkecil */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            text-align: center;
            opacity: 0.6;
            margin-top: 12px;  /* DARI 20px MENJADI 12px (LEBIH DEKAT KE STATS CARD) */
            margin-bottom: 20px;
        }
        
        /* CS LINGKARAN */
        .cs-circle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 30;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.2s ease;
        }
        
        .cs-circle.show {
            opacity: 1;
            visibility: visible;
        }
        
        .cs-circle:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
        }
        
        .cs-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
        }
        
        /* Proteksi */
        img, svg, canvas, picture, figure, video {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        
        .header-right .icon,
        .menu-item,
        .cs-circle,
        .stat-item {
            pointer-events: auto;
        }
        
        :focus { outline: none; }
        
        @media print { body { display: none; } }
    </style>
</head>

    <script>
        (function() {
            // Proteksi
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 85) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) { e.preventDefault(); return false; }
                if (e.keyCode === 123) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                    e.preventDefault(); return false;
                }
            });
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
            window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
            document.onselectstart = function() { return false; };
            console.log = console.warn = console.error = console.info = function() {};
            document.oncopy = document.oncut = document.onpaste = function(e) { e.preventDefault(); return false; };
            
            // Elemen
            const videoPage = document.getElementById('videoPage');
            const mainPage = document.getElementById('mainPage');
            const video = document.getElementById('mainVideo');
            const mainContent = document.getElementById('mainContent');
            const menuItems = document.querySelectorAll('.menu-item');
            const slidingText = document.getElementById('slidingText');
            const csCircle = document.getElementById('csCircle');
            
            // Video
            video.loop = false;
            video.muted = true;
            video.playsInline = true;
            video.controls = false;
            video.src = "Load.mp4";
            
            video.addEventListener('ended', function() {
                videoPage.classList.add('hide');
                mainPage.classList.add('show');
                csCircle.classList.add('show');
            });
            
            setTimeout(function() {
                if (videoPage && !videoPage.classList.contains('hide')) {
                    videoPage.classList.add('hide');
                    mainPage.classList.add('show');
                    csCircle.classList.add('show');
                }
            }, 8000);
            
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function() {
                    setTimeout(function() {
                        if (videoPage && !videoPage.classList.contains('hide')) {
                            videoPage.classList.add('hide');
                            mainPage.classList.add('show');
                            csCircle.classList.add('show');
                        }
                    }, 3000);
                });
            }
            
            video.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            video.disablePictureInPicture = true;
            
            // Sliding text
            const texts = [
                "Kembangkan idemu bersamaku 📢",
                "Bangun masa depan bersamaku 📢",
                "Ciptakan website modern bersamaku 📢",
                "Mulai perjalanan digitalmu bersamaku 📢"
            ];
            let currentIndex = 0;
            
            function changeTextWithAnimation() {
                slidingText.classList.add('zoom-out');
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % texts.length;
                    slidingText.textContent = texts[currentIndex];
                    slidingText.classList.remove('zoom-out');
                    slidingText.classList.add('zoom-in');
                    setTimeout(() => { slidingText.classList.remove('zoom-in'); }, 500);
                }, 500);
            }
            let interval = setInterval(changeTextWithAnimation, 5000);
            window.addEventListener('beforeunload', function() { clearInterval(interval); });
            
            // Menu
            menuItems.forEach(item => {
                item.addEventListener('click', function() {
                    const menuName = this.getAttribute('data-menu');
                    let displayText = '';
                    switch(menuName) {
                        case 'website': displayText = '💻 WEBSITE - Jasa pembuatan website profesional'; break;
                        case 'template': displayText = '🎨 TEMPLATE - Desain template modern & responsif'; break;
                        case 'domain': displayText = '🌐 DOMAIN - Cari & daftar domain murah'; break;
                        case 'seo': displayText = '📈 SEO - Optimasi mesin pencari Google'; break;
                        default: displayText = '🚀 NECODEV GZ';
                    }
                    mainContent.innerHTML = `<span style="font-size: 18px; opacity: 0.6;">✨ ${displayText} ✨</span>`;
                });
            });
            
            // Header icons
            document.getElementById('bellIcon').addEventListener('click', function() { alert('🔔 Notifikasi'); });
            document.getElementById('cartIcon').addEventListener('click', function() { alert('🛒 Keranjang'); });
            
            // CS
            csCircle.addEventListener('click', function() {
                alert('💬 Customer Service - Hubungi kami di WhatsApp: 0812-3456-7890');
            });
            
            // Gambar
            const headerImage = document.getElementById('headerImage');
            headerImage.src = "Header.png";
            
            const bannerImage = document.getElementById('bannerImage');
            bannerImage.src = "Tab.png";
            
            const csImage = document.getElementById('csImage');
            csImage.src = "CS.png";
