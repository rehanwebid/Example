<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) ========== -->
    <title>NECODEV GZ</title>
    <meta name="description" content="NECODEV GZ - Platform pengembangan teknologi modern. Halaman ini dilindungi dari akses source code dan pengunduhan gambar.">
    
    <link rel="icon" type="image/png" sizes="512x512" href="#">
    <link rel="shortcut icon" href="#">
    <!-- ========== PENANDA KHUSUS: BAGIAN PENTING (1) SELESAI ========== -->
    
    <style>
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) - CSS PROTEKSI & STYLE ========== */
        * {
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        /* ===== HALAMAN VIDEO ===== */
        .video-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            display: block;
            width: auto;
            height: auto;
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border: none;
            outline: none;
            box-shadow: none;
            background: transparent;
        }
        
        video:focus {
            outline: none;
        }
        
        video::-webkit-media-controls {
            display: none !important;
        }
        
        /* ===== HALAMAN UTAMA ===== */
        .main-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto;
            padding: 20px;
        }
        
        .main-page.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* HEADER RAMPiNG - tinggi mengikuti konten, bukan gambar */
        .header {
            background-color: white;
            border-radius: 15px;
            padding: 8px 16px;  /* PADDING KECIL = RAMPiNG */
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            gap: 16px;
            min-height: 48px;  /* minimal tinggi, tidak memaksa besar */
        }
        
        /* Bagian kiri: gambar 16:5 yang mengecil mengikuti header */
        .header-left {
            flex-shrink: 0;  /* tidak menekan gambar */
        }
        
        .header-image {
            height: 32px;  /* TINGGI GAMBAR DIPAKSA KECIL (32px) */
            width: auto;    /* lebar otomatis mengikuti rasio 16:5 */
            aspect-ratio: 16 / 5;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            background: transparent;
        }
        
        /* Bagian kanan: ikon */
        .header-right {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon:hover {
            transform: scale(1.05);
        }
        
        .icon svg {
            width: 22px;
            height: 22px;
            display: block;
        }
        
        /* Content placeholder biar header terlihat sendiri */
        .content-placeholder {
            margin-top: 40px;
            text-align: center;
            color: white;
            opacity: 0.3;
            font-size: 12px;
        }
        
        /* Proteksi drag */
        img, svg, canvas, picture, figure, video {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        
        .header-right .icon {
            pointer-events: auto;
        }
        
        :focus {
            outline: none;
        }
        
        @media print {
            body { display: none; }
        }
        /* ========== PENANDA KHUSUS: BAGIAN PENTING (2) SELESAI ========== */
    </style>
</head>
<body>
    <!-- HALAMAN VIDEO -->
    <div class="video-page" id="videoPage">
        <div class="video-container">
            <video id="mainVideo" autoplay muted playsinline disablePictureInPicture controlslist="nodownload nofullscreen">
                <source src="Pict/Load.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    
    <!-- HALAMAN UTAMA DENGAN HEADER RAMPiNG -->
    <div class="main-page" id="mainPage">
        <div class="header">
            <div class="header-left">
                <img class="header-image" src="Pict/Head.png" alt="header image" id="headerImage">
            </div>
            <div class="header-right">
                <div class="icon bell-icon" id="bellIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.93 6 11v5l-2 2v1h16v-1l-2-2z"/>
                    </svg>
                </div>
                <div class="icon cart-icon" id="cartIcon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="content-placeholder">
            <!-- Konten bebas -->
        </div>
    </div>
    
    <script>
        (function() {
            // ========== PROTEKSI ==========
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 85) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 83) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) { e.preventDefault(); return false; }
                if (e.keyCode === 123) { e.preventDefault(); return false; }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
                    e.preventDefault(); return false;
                }
            });
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
            window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
            document.onselectstart = function() { return false; };
            console.log = console.warn = console.error = console.info = function() {};
            document.oncopy = document.oncut = document.onpaste = function(e) { e.preventDefault(); return false; };
            
            // ========== VIDEO ==========
            const videoPage = document.getElementById('videoPage');
            const mainPage = document.getElementById('mainPage');
            const video = document.getElementById('mainVideo');
            
            video.loop = false;
            video.muted = true;
            video.playsInline = true;
            video.controls = false;
            
            // PAKAI LINK VIDEO ONLINE
            video.src = "https://www.learningcontainer.com/wp-content/uploads/2020/05/sample-mp4-file.mp4";
            
            video.addEventListener('ended', function() {
                videoPage.style.opacity = '0';
                setTimeout(function() {
                    videoPage.style.display = 'none';
                    mainPage.classList.add('show');
                }, 500);
            });
            
            video.play().catch(() => {});
            video.addEventListener('contextmenu', (e) => e.preventDefault());
            video.disablePictureInPicture = true;
            
            // ========== IKON ==========
            document.getElementById('bellIcon').addEventListener('click', () => alert('Notifikasi'));
            document.getElementById('cartIcon').addEventListener('click', () => alert('Keranjang'));
            
            // ========== FOTO HEADER 16:5 ==========
            const headerImage = document.getElementById('headerImage');
            // Ganti dengan link foto 16:5 Anda atau biarkan sebagai placeholder
            headerImage.src = "https://placehold.co/160x50/cccccc/969696?text=16:5";
            // headerImage.style.height = "32px"; // sudah diatur di CSS
        })();
    </script>
</body>
</html>
