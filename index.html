<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NECODEV GZ</title>
    <!-- Google Fonts: Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Remix Icon - Premium & Modern Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* RESET & LAYAR HITAM TOTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: black;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Container utama dengan padding-top untuk header fixed */
        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #000000;
            display: flex;
            flex-direction: column;
            padding: 0 12px;
            padding-bottom: 40px;
            padding-top: 60px;
        }

        /* HEADER: FIXED (TIDAK GERAK) */
        .header {
            background-color: #000000;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            min-height: 32px;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-photo {
            width: 20px;
            height: 20px;
            border-radius: 0;
            object-fit: cover;
            background-color: #1a1a1a;
        }

        .header-text {
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-right i {
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        /* FOTO 1:1 MURNI DI KANAN BAWAH (FIXED) - TANPA LINGKARAN */
        .fixed-photo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
            z-index: 1000;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .fixed-photo:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* GAMBAR MURNI 16:7 */
        .hero-image {
            width: 100%;
            margin: 10px auto 0 auto;
            display: block;
            aspect-ratio: 16 / 7;
            object-fit: cover;
        }

        /* PERSEGI PANJANG (info bar pertama) */
        .info-bar {
            background-color: #000000;
            width: 100%;
            margin: 2px auto 0 auto;
            padding: 1px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 22px;
        }

        .info-bar-text {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Orbitron', monospace;
            font-size: 8px;
            letter-spacing: 0.3px;
            display: inline-block;
        }

        .prefix-symbol {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', monospace;
            font-size: 8px;
            margin-right: 4px;
            display: inline-block;
        }

        .typing-container {
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 1px;
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .info-bar-photo {
            width: 16px;
            height: 16px;
            object-fit: cover;
        }

        .layanan-text {
            width: 100%;
            margin: 7px auto 0 auto;
            text-align: left;
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }

        /* ============ SWIPEABLE ICONS SECTION ============ */
        .swipe-section {
            width: 100%;
            margin: 18px auto 0 auto;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .swipe-section::-webkit-scrollbar {
            display: none;
        }

        .swipe-track {
            display: flex;
            flex-direction: row;
            width: 200%;
        }

        .group-page {
            width: 50%;
            flex-shrink: 0;
            scroll-snap-align: start;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .icon-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
            cursor: pointer;
        }

        .icon-item i {
            color: white;
            font-size: 28px;
        }

        .icon-label {
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Orbitron', monospace;
            font-size: 8px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .dots-indicator {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            margin-bottom: 4px;
        }

        .dot-page {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot-page.active {
            width: 18px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.9);
        }

        .card-wrapper {
            width: 100%;
            margin: 12px auto 0 auto;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            background-color: #000000;
        }

        .three-bars-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .bar-item {
            background-color: #000000;
            width: 100%;
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
        }

        .bar-photo {
            width: 28px;
            height: 28px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .bar-text {
            flex: 1;
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        .trending-text {
            width: 100%;
            margin: 12px auto 0 auto;
            text-align: left;
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.5px;
        }

        .square-16-11 {
            width: 100%;
            margin: 12px auto 0 auto;
            aspect-ratio: 16 / 11;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            background-color: #000000;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

        .lihat-semua {
            text-align: right;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
        }

        .foto-16-9-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 4px;
            overflow: hidden;
        }

        .foto-16-9 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: none;
            outline: none;
        }

        .btn-view {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            font-weight: 500;
            color: white;
        }

        .new-header-bar {
            background-color: #000000;
            width: 100%;
            margin: 12px auto 0 auto;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 32px;
        }

        .new-bar-photo {
            width: 20px;
            height: 20px;
            border-radius: 0;
            object-fit: cover;
            flex-shrink: 0;
        }

        .new-bar-text {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 0.3px;
            flex: 1;
        }

        .main-content {
            height: 20px;
        }

        canvas, iframe, svg, video {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- HEADER FIXED -->
    <div class="header">
        <div class="header-left">
            <img class="profile-photo" src="ikon.png" alt="profile">
            <span class="header-text">NECODEV GZ</span>
        </div>
        <div class="header-right">
            <i class="ri-notification-3-line"></i>
            <i class="ri-shopping-cart-2-line"></i>
        </div>
    </div>

    <!-- FOTO 1:1 MURNI DI KANAN BAWAH (FIXED) - TANPA LINGKARAN -->
    <img class="fixed-photo" src="ikon.png" alt="fixed photo">

    <!-- KONTEN UTAMA -->
    <img class="hero-image" src="tab.png" alt="hero banner">

    <div class="info-bar">
        <div class="info-bar-text">
            <span class="prefix-symbol">&gt;</span>
            <span class="typing-container">
                <span id="animated-text"></span>
                <span class="cursor">|</span>
            </span>
        </div>
        <img class="info-bar-photo" src="ikon.png" alt="small profile">
    </div>

    <div class="layanan-text">Layanan NECO</div>

    <div class="swipe-section" id="swipeSection">
        <div class="swipe-track" id="swipeTrack">
            <div class="group-page">
                <div class="icon-item"><i class="ri-global-line"></i><span class="icon-label">Website</span></div>
                <div class="icon-item"><i class="ri-layout-4-line"></i><span class="icon-label">Template</span></div>
                <div class="icon-item"><i class="ri-bar-chart-2-line"></i><span class="icon-label">Domin</span></div>
                <div class="icon-item"><i class="ri-line-chart-line"></i><span class="icon-label">SEO</span></div>
            </div>
            <div class="group-page">
                <div class="icon-item"><i class="ri-flashlight-line"></i><span class="icon-label">Pulsa</span></div>
                <div class="icon-item"><i class="ri-wifi-line"></i><span class="icon-label">Kouta</span></div>
                <div class="icon-item"><i class="ri-gamepad-line"></i><span class="icon-label">Game</span></div>
                <div class="icon-item"><i class="ri-edit-box-line"></i><span class="icon-label">Editing</span></div>
            </div>
        </div>
    </div>

    <div class="dots-indicator">
        <div class="dot-page active" data-index="0"></div>
        <div class="dot-page" data-index="1"></div>
    </div>

    <div class="card-wrapper">
        <div class="three-bars-container">
            <div class="bar-item">
                <img class="bar-photo" src="ikon.png" alt="template 1">
                <span class="bar-text">Template portofolio dark blue pro</span>
            </div>
            <div class="bar-item">
                <img class="bar-photo" src="ikon.png" alt="template 2">
                <span class="bar-text">Template company profil chiken rocket</span>
            </div>
            <div class="bar-item">
                <img class="bar-photo" src="ikon.png" alt="template 3">
                <span class="bar-text">Template E-commerce caffee shopp</span>
            </div>
        </div>
    </div>

    <div class="trending-text">Yang sedang trend</div>

    <div class="square-16-11">
        <div class="lihat-semua">Lihat semua &gt;</div>
        <div class="foto-16-9-container">
            <img class="foto-16-9" src="pro.png" alt="trending image">
            <div class="btn-view">
                <i class="ri-eye-line"></i>
                <span>View</span>
            </div>
        </div>
    </div>

    <div class="new-header-bar">
        <img class="new-bar-photo" src="ikon.png" alt="new bar photo">
        <span class="new-bar-text">Nantikan selalu update dari NECODEV GZ</span>
    </div>

    <div class="main-content"></div>
</div>

<script>
    (function() {
        const texts = [
            "Bangun masa depan bersama ku",
            "Kembakan idemu bersamaku",
            "Mulai perjalanan bersamaku",
            "Ciptakan Website moderen bersamaku"
        ];
        let textIndex = 0, charIndex = 0, isDeleting = false, currentText = "";
        const animatedTextElement = document.getElementById("animated-text");
        const TYPING_SPEED = 50, DELETING_SPEED = 30, PAUSE = 5000;

        function typeEffect() {
            if (!animatedTextElement) return;
            const fullText = texts[textIndex];
            if (isDeleting) {
                currentText = fullText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                currentText = fullText.substring(0, charIndex + 1);
                charIndex++;
            }
            animatedTextElement.textContent = currentText;
            if (!isDeleting && charIndex === fullText.length) {
                isDeleting = true;
                setTimeout(typeEffect, PAUSE);
                return;
            }
            if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
                setTimeout(typeEffect, TYPING_SPEED);
                return;
            }
            setTimeout(typeEffect, isDeleting ? DELETING_SPEED : TYPING_SPEED);
        }
        setTimeout(typeEffect, 500);

        const swipeSection = document.getElementById('swipeSection');
        const dots = document.querySelectorAll('.dot-page');
        let currentIndex = 0;

        function updateActiveDot() {
            if (!swipeSection) return;
            const newIndex = Math.round(swipeSection.scrollLeft / swipeSection.clientWidth);
            if (newIndex !== currentIndex && newIndex >= 0 && newIndex < dots.length) {
                currentIndex = newIndex;
                dots.forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentIndex);
                });
            }
        }

        function scrollToPage(index) {
            if (!swipeSection) return;
            swipeSection.scrollTo({ left: swipeSection.clientWidth * index, behavior: 'smooth' });
            currentIndex = index;
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === index);
            });
        }

        if (swipeSection) {
            swipeSection.addEventListener('scroll', () => requestAnimationFrame(updateActiveDot));
            window.addEventListener('resize', () => updateActiveDot());
        }
        dots.forEach((dot, idx) => dot.addEventListener('click', () => scrollToPage(idx)));

        // Proteksi
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'K')) e.preventDefault();
            if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) e.preventDefault();
        });
        document.addEventListener('selectstart', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());
        window.addEventListener('dragover', (e) => e.preventDefault());

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.nodeType === 1 && node.tagName === 'IMG' && 
                        !node.classList.contains('profile-photo') && 
                        !node.classList.contains('hero-image') && 
                        !node.classList.contains('info-bar-photo') && 
                        !node.classList.contains('bar-photo') &&
                        !node.classList.contains('foto-16-9') &&
                        !node.classList.contains('new-bar-photo') &&
                        !node.classList.contains('fixed-photo')) {
                        node.remove();
                    }
                });
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
</script>
</body>
</html>
